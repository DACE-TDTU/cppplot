name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ═══════════════════════════════════════════
  # Linux — GCC & Clang
  # ═══════════════════════════════════════════
  linux:
    name: "Linux · ${{ matrix.compiler }} · C++${{ matrix.std }}"
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC-12
            cc:  gcc-12
            cxx: g++-12
            std: 17
          - compiler: GCC-12
            cc:  gcc-12
            cxx: g++-12
            std: 14
          - compiler: Clang-14
            cc:  clang-14
            cxx: clang++-14
            std: 17
          - compiler: Clang-14
            cc:  clang-14
            cxx: clang++-14
            std: 14

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCPPPLOT_BUILD_EXAMPLES=ON \
            -DCPPPLOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 2

      - name: Upload SVG outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-linux-${{ matrix.compiler }}-cpp${{ matrix.std }}
          path: build/tests/output/*.svg
          if-no-files-found: ignore

  # ═══════════════════════════════════════════
  # Windows — MSVC
  # ═══════════════════════════════════════════
  windows:
    name: "Windows · MSVC · C++${{ matrix.std }}"
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        std: [ 17, 14 ]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} `
            -DCPPPLOT_BUILD_EXAMPLES=ON `
            -DCPPPLOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

  # ═══════════════════════════════════════════
  # macOS — Apple Clang
  # ═══════════════════════════════════════════
  macos:
    name: "macOS · AppleClang · C++${{ matrix.std }}"
    runs-on: macos-13

    strategy:
      fail-fast: false
      matrix:
        std: [ 17, 14 ]

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake & Ninja
        run: brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCPPPLOT_BUILD_EXAMPLES=ON \
            -DCPPPLOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # ═══════════════════════════════════════════
  # Header-only: không cần CMake, chỉ g++ -I
  # ═══════════════════════════════════════════
  header-only:
    name: "Header-only include check"
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Compile minimal example (no CMake)
        run: |
          cat > /tmp/minimal.cpp << 'EOF'
          #include "include/cppplot/cppplot.hpp"
          using namespace cppplot;
          int main() {
              auto x = linspace(0.0, 6.28, 50);
              std::vector<double> y;
              for (double xi : x) y.push_back(std::sin(xi));
              figure(400, 300);
              plot(x, y, "b-");
              title("Header-only CI check");
              savefig("/tmp/check.svg");
              return 0;
          }
          EOF
          g++ -std=c++17 -I. /tmp/minimal.cpp -o /tmp/minimal_test
          /tmp/minimal_test

      - name: Validate SVG output
        run: |
          test -s /tmp/check.svg || (echo "SVG empty or missing" && exit 1)
          head -c 10 /tmp/check.svg | grep -qE "(<\?xml|<svg)" \
            || (echo "Not valid SVG" && exit 1)
          echo "SVG valid: $(wc -c < /tmp/check.svg) bytes"
